name: CI

on:
  push:
    branches: [main]
  pull_request:
  # The dependency audit depends on advisories published after a commit, so it also runs on its own.
  schedule:
    - cron: '0 21 * * 1'

permissions:
  contents: read

# A new commit on a pull request cancels the run for the one before it, whose result no longer counts.
# A push to main has a group of its own and is always checked to the end. In a group shared by main, a
# merge within minutes of another cancels the earlier commit's run, so that commit is never checked and
# its result job reports the cancellation as a failure.
concurrency:
  group: ci-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: true

# The app's checks run as separate jobs at the same time. In one job they took seven and a half minutes
# on macos-latest (2026-09-25): npm test 122 s, demo:fit 205 s and the unsigned build 79 s.
jobs:
  # Whether anything outside website/ changed (app), whether a file the demo reads changed (layout), and whether a
  # file that can move the viewer budgets changed (viewers).
  # A workflow left out by a paths filter never reports the result job the main ruleset requires, so the
  # pull request would wait forever; the app's jobs are skipped by their if: instead.
  changes:
    if: github.event_name != 'schedule'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      app: ${{ steps.diff.outputs.app }}
      layout: ${{ steps.diff.outputs.layout }}
      viewers: ${{ steps.diff.outputs.viewers }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 2
      # The first parent is the base of a pull request's merge commit, and the previous main of a squash merge.
      # git diff names a renamed file by its new path alone and quotes a name with characters outside ASCII, so a
      # file moved out of a listed folder or named in Japanese would match nothing: --no-renames lists both paths
      # and -z writes every name as it is. Written to a file, a failing git diff fails the step, which a pipe into
      # grep would hide by giving it no names.
      # layout lists the files that a build of the demo and a run of demo:fit read, traced on 2026-10-03: the
      # renderer, src/shared, the memory templates src/shared imports, the demo's config, fit's scripts and the
      # dependencies. It adds the configuration Vite and Tailwind look for at the root and in src/: a package.json,
      # pnpm-workspace.yaml or lerna.json in src/ would keep the demo from serving the templates under resources/,
      # and an ignore file decides which of the renderer's files Tailwind scans for class names. The job's own
      # workflow and setup complete it. A file the demo comes to read from elsewhere has to join the list, or a
      # change to it skips fit.
      # viewers lists the files that can move what the viewer budgets measure: what the files card, the card's frame
      # (PanelCard, PanelContent, FocusOverlay) and the preview page import, with the scene, its cases, the demo's
      # config and the range parser the demo serves the files with; the pages that hold them, the demo's hooks the
      # scene calls and the generators' Office samples; the dependencies and the job itself. The walk lists
      # registry.tsx, stores.ts, renderer/src/i18n.ts and the dictionary's index but does not follow them into the
      # other cards, the store's other modules and the dictionary's words: they load with the app, but they do not
      # change the time or the memory a viewer takes, and following them would have run the budgets on 28 of the last
      # 40 pull requests instead of 18. tests/ci-viewers-list.test.ts walks the same imports and fails on a file no
      # pattern matches. The page measured is the whole app (/app), so a change off the list, such as to the global
      # CSS that sizes and scrolls the focus view (main.css, themes.css), can still move a budget; the weekly run
      # shows it.
      - id: diff
        run: |
          git diff --name-only --no-renames -z HEAD^ HEAD > "$RUNNER_TEMP/changed"
          if grep -qzv '^website/' "$RUNNER_TEMP/changed"; then
            echo app=true >> "$GITHUB_OUTPUT"
          fi
          if grep -qzE \
            -e '^src/(renderer|shared)/' \
            -e '^resources/skills/memory-curation[^/]*/assets/templates/' \
            -e '^resources/skills/memory-format\.json$' \
            -e '^scripts/(vite\.demo\.config\.mts|demo-page-view\.mts|aizuchi-clips/review-api\.mjs|cdp/[^/]+\.mjs|cdp/scenes/fit\.mjs)$' \
            -e '^package-lock\.json$' \
            -e '^(src/)?(package\.json|pnpm-workspace\.yaml|lerna\.json|tsconfig[^/]*\.json)$' \
            -e '^(src/)?(postcss\.config\.[^/]+|\.postcssrc[^/]*|\.?browserslist(rc)?|\.gitignore|\.ignore)$' \
            -e '^\.github/workflows/ci\.yml$' \
            -e '^\.github/actions/setup-app/' \
            "$RUNNER_TEMP/changed"; then
            echo layout=true >> "$GITHUB_OUTPUT"
          fi
          if grep -qzE \
            -e '^src/renderer/(index|preview)\.html$' \
            -e '^src/renderer/src/(preview|panels/(viewers|shell|primitives))/' \
            -e '^src/renderer/src/panels/(builtin/files\.(tsx|css)|open-files\.ts|registry\.tsx)$' \
            -e '^src/renderer/src/(ui/(FocusOverlay|key-for-app)|state/stores|display-error|i18n|open-link|platform)\.tsx?$' \
            -e '^src/renderer/src/demo/(index\.tsx|PageView\.tsx|routes\.ts)$' \
            -e '^src/renderer/demo-public/demo-files/office/(slides\.pptx|report\.docx)$' \
            -e '^src/shared/(byte-range|external-link|file-path|files|office-package|preview-page|zip-directory|i18n/(index|error-key|error-text|os-message))\.ts$' \
            -e '^scripts/(vite\.demo\.config\.mts|demo-page-view\.mts|aizuchi-clips/review-api\.mjs|cdp/(cdp|demo-server|viewer-measure)\.mjs)$' \
            -e '^scripts/cdp/(scenes/viewer-budgets\.mjs$|scenes/viewer-budgets/|viewer-files/)' \
            -e '^(package|package-lock|tsconfig[^/]*)\.json$' \
            -e '^\.github/workflows/ci\.yml$' \
            -e '^\.github/actions/setup-app/' \
            "$RUNNER_TEMP/changed"; then
            echo viewers=true >> "$GITHUB_OUTPUT"
          fi

  # The app is built for macOS on Apple Silicon, which macos-latest is, and for Windows x64, which
  # windows-latest is.
  test:
    needs: changes
    if: needs.changes.outputs.app == 'true'
    runs-on: macos-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # The tests run git through the bundled git and the memory curation's Python checks through the bundled uv,
      # as the app does, on the Python set up below. When this cache misses, the pretest step compiles git from
      # source, which took 34 to 80 s on macos-latest (2026-10-03), and fetches uv (17 to 18 MB).
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            resources/git
            resources/uv
          key: bundled-git-uv-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('scripts/resources/git-*.mjs', 'scripts/resources/uv.mjs') }}
      - uses: ./.github/actions/setup-app
      # tests/vap-worker.test.ts runs the MaAI worker, which imports numpy, with the Python and numpy versions of
      # the app's own environment (resources/vap-requirements.txt).
      - id: python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'
      - run: python -m pip install numpy==2.5.2
      - run: npm run typecheck
      - run: npm run i18n -- check
      # Vitest runs one worker fewer than the runner's three CPUs, and most of the git tests' time is spent waiting for
      # git: with three workers it took 94 to 106 s against 142 to 201 s with two, in three runs each on macos-latest
      # (2026-10-03).
      - run: npm test -- --maxWorkers=3
        env:
          ASIST_VAP_PYTHON: ${{ steps.python.outputs.python-path }}

  # Whether the files card's viewers still show large files without going back to reading or drawing the whole
  # file, in Chrome on the demo: a case fails past limits far from what the viewers reach on this runner, and its
  # tighter budgets (scripts/cdp/scenes/viewer-budgets/), with the times three times as long for the shared runner,
  # are only reported. The runner has 7 GB, and the scene never runs two Chromes at once. It runs when a file on the
  # viewers list changed, and in the weekly run, when changes does not run.
  viewer-budgets:
    needs: changes
    if: ${{ !cancelled() && (github.event_name == 'schedule' || needs.changes.outputs.viewers == 'true') }}
    runs-on: macos-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/setup-app
      # Writing the samples took 2.75 min on macos-latest (2026-10-03). The scene keeps them in a folder named after
      # the generators' version, and the cache takes the same name. The WAV and the zip, 806 MB that does not
      # compress, are written again in 3 s rather than kept. The paths name the files, not the folder: tar takes a
      # folder whole, which the exclusions would not reach.
      - id: generators
        run: node --input-type=module -e "import { generatorVersion } from './scripts/cdp/viewer-files/index.mjs'; console.log('version=' + generatorVersion())" >> "$GITHUB_OUTPUT"
      - id: samples
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ${{ runner.temp }}/viewer-files/*/*
            !${{ runner.temp }}/viewer-files/*/*.wav
            !${{ runner.temp }}/viewer-files/*/*.zip
          key: viewer-files-${{ runner.os }}-${{ runner.arch }}-${{ steps.generators.outputs.version }}
      # The two-hour MP3 is written with lame, which the runner does not have. Homebrew installed it with mpg123 in
      # 3.5 s on macos-latest (2026-10-02).
      - if: steps.samples.outputs.cache-hit != 'true'
        run: brew install lame
        env:
          HOMEBREW_NO_AUTO_UPDATE: '1'
      - run: npm run demo:viewer-budgets -- --time-factor 3 --files "$RUNNER_TEMP/viewer-files"

  # Whether the text of every card and screen still fits in each of the eleven languages and every theme,
  # in Chrome. The layout depends on the fonts of macOS, so it runs there, with the themes shared out.
  # It holds two macOS runners for 3 to 4 minutes each, so it runs only when a file the demo reads changed
  # (layout); no other change can move what the demo draws.
  fit:
    needs: changes
    if: needs.changes.outputs.layout == 'true'
    runs-on: macos-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        shard: [1/2, 2/2]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/setup-app
      - run: npm run demo:fit -- --shard ${{ matrix.shard }}
      # demo:fit captures what did not fit into fit-shots/; the pictures are kept with the failed run.
      - if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: fit-shots-${{ strategy.job-index }}
          path: fit-shots/
          if-no-files-found: ignore

  # Builds the native helpers, the bundle and an unsigned app, which also checks electron-builder.yml.
  build:
    needs: changes
    if: needs.changes.outputs.app == 'true'
    runs-on: macos-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # git, uv, llama.cpp and speech.cpp are pinned in these modules, and their VERSION stamps record the
      # modules' content, so the modules are the key.
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            resources/git
            resources/uv
            resources/llama.cpp
            resources/speech-worker
          key: bundled-tools-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('scripts/resources/git-*.mjs', 'scripts/resources/uv.mjs', 'scripts/resources/llama-cpp.mjs', 'scripts/resources/speech-worker.mjs') }}
      - uses: ./.github/actions/setup-app
      - run: npm run dist:mac:unsigned
        # electron.vite.config.ts embeds Google's OAuth client in the main process. A pull request from a fork
        # gets no secrets and builds without it, which only signing in to Google Calendar would notice.
        env:
          ASIST_GOOGLE_CLIENT_ID: ${{ secrets.ASIST_GOOGLE_CLIENT_ID }}
          ASIST_GOOGLE_CLIENT_SECRET: ${{ secrets.ASIST_GOOGLE_CLIENT_SECRET }}
      - name: Run the git, uv and speech programs inside the app
        run: |
          resources="dist/mac-arm64/ASIST.app/Contents/Resources"
          "$resources/git/bin/git" --version
          "$resources/uv/uv" --version
          "$resources/llama.cpp/llama-server" --version
          "$resources/speech-worker/speech-worker" --devices

  # The tests of test on Windows. The types and the dictionary do not depend on the OS, and test checks them. The
  # tests are shared out between two runners: Windows runners did not wait for one on 2026-10-02 and 03, while the
  # tests on one took 268 to 294 s of Vitest and made the longest job of a pull request. Vitest shares the files out
  # by a hash of their paths, not by their time, so the second half holds the two agent-worktree files and the memory
  # curation's, 408 of the 613 s the tests summed on 2026-10-03.
  test-windows:
    needs: changes
    if: needs.changes.outputs.app == 'true'
    runs-on: windows-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        shard: [1/2, 2/2]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # The bundled git and uv, as in test; on Windows the pretest step fetches MinGit when this cache misses.
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            resources/git
            resources/uv
          key: bundled-git-uv-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('scripts/resources/git-*.mjs', 'scripts/resources/uv.mjs') }}
      - uses: ./.github/actions/setup-app
      - id: python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'
      - run: python -m pip install numpy==2.5.2
      # %TEMP% is on C:, which makes an 8.3 short name for every file, and D:, the runner's work disk, makes none.
      # The tests make thousands of repositories and files there, and Vitest took 162 to 270 s with TEMP on D:
      # against 283 to 334 s on C:, in five runs each on windows-latest (2026-10-03). The test of a memory folder
      # written with a short name makes its folder on C: itself, and ASIST_REQUIRE_SHORT_NAMES fails it rather than
      # skipping it when the folder gets none. Four workers on the runner's four vCPUs took 176 to 285 s with TEMP on
      # D:, no less than Vitest's three, so the tests keep three.
      - run: npm test -- --shard ${{ matrix.shard }}
        env:
          ASIST_VAP_PYTHON: ${{ steps.python.outputs.python-path }}
          TEMP: ${{ runner.temp }}
          TMP: ${{ runner.temp }}
          ASIST_REQUIRE_SHORT_NAMES: '1'

  # Builds the agent launcher and the microphone helper with the MSVC of the runner's Visual Studio, the bundle and the unpacked app.
  build-windows:
    needs: changes
    if: needs.changes.outputs.app == 'true'
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            resources/git
            resources/uv
            resources/llama.cpp
            resources/speech-worker
          key: bundled-tools-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('scripts/resources/git-*.mjs', 'scripts/resources/uv.mjs', 'scripts/resources/llama-cpp.mjs', 'scripts/resources/speech-worker.mjs') }}
      - uses: ./.github/actions/setup-app
      - run: npm run dist:win:dir
        # electron.vite.config.ts embeds Google's OAuth client in the main process. A pull request from a fork
        # gets no secrets and builds without it, which only signing in to Google Calendar would notice.
        env:
          ASIST_GOOGLE_CLIENT_ID: ${{ secrets.ASIST_GOOGLE_CLIENT_ID }}
          ASIST_GOOGLE_CLIENT_SECRET: ${{ secrets.ASIST_GOOGLE_CLIENT_SECRET }}
      - name: Run the git, uv, speech programs, agent launcher and microphone helper inside the app
        shell: bash
        run: |
          resources="dist/win-unpacked/resources"
          "$resources/git/mingw64/bin/git.exe" --version
          "$resources/uv/uv.exe" --version
          "$resources/llama.cpp/llama-server.exe" --version
          "$resources/speech-worker/speech-worker.exe" --devices
          "$resources/asist-agent-launcher.exe" --version
          "$resources/asist-mic.exe" --version
      # A changed app.asar stops ASIST.exe within a second with "Integrity check failed for asar archive"
      # (measured 2026-09-27 on Electron 43.1.0), so an app still running after 20 seconds passed the check.
      - name: Start the app and stop it once it has passed the ASAR integrity check
        shell: pwsh
        env:
          ELECTRON_ENABLE_LOGGING: file
          ELECTRON_LOG_FILE: ${{ runner.temp }}\electron.log
        run: |
          $app = Start-Process -FilePath dist\win-unpacked\ASIST.exe -PassThru
          Start-Sleep -Seconds 20
          $exited = $app.HasExited
          if (-not $exited) { taskkill.exe /T /F /PID $app.Id }
          Get-Content $env:ELECTRON_LOG_FILE -TotalCount 20 -ErrorAction SilentlyContinue
          if ($exited) { throw "ASIST.exe exited within 20 seconds with code $($app.ExitCode)" }

  # The website is its own npm project, built with Astro; it needs no Mac.
  website:
    if: github.event_name != 'schedule'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: website/package-lock.json
      - run: npm ci --prefix website
      - run: npm --prefix website test
      - run: npm run website:build

  # The one job the main ruleset requires, so that it names neither each shard of fit and test-windows nor the jobs
  # a change to the website skips. A skipped job is not a failure.
  result:
    if: always() && github.event_name != 'schedule'
    needs: [changes, test, viewer-budgets, fit, build, website, test-windows, build-windows]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - if: contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled')
        run: exit 1

  # Without node_modules, npm audit checks the tree in the lockfile, which is the same on every OS, so the job takes
  # no macOS runner from the others.
  audit:
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
      - run: npm audit --omit=dev
